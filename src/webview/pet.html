<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Pet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: transparent;
    }

    #pet-container {
      position: fixed;
      width: 200px;
      height: 200px;
      left: 100px;
      top: 100px;
      cursor: move;
      user-select: none;
    }

    #pet-canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 8px;
    }

    #pet-container:hover {
      outline: 2px dashed rgba(100, 100, 100, 0.5);
    }

    .resize-handle {
      position: absolute;
      width: 16px;
      height: 16px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(100, 100, 100, 0.5);
      border-radius: 2px;
    }

    .resize-handle.se { bottom: -8px; right: -8px; cursor: se-resize; }
    .resize-handle.sw { bottom: -8px; left: -8px; cursor: sw-resize; }
    .resize-handle.ne { top: -8px; right: -8px; cursor: ne-resize; }
    .resize-handle.nw { top: -8px; left: -8px; cursor: nw-resize; }

    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #666;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div id="loading">Loading...</div>
  <div id="pet-container" style="display: none;">
    <canvas id="pet-canvas" width="200" height="200"></canvas>
    <div class="resize-handle se" data-corner="se"></div>
    <div class="resize-handle sw" data-corner="sw"></div>
    <div class="resize-handle ne" data-corner="ne"></div>
    <div class="resize-handle nw" data-corner="nw"></div>
  </div>

  <script>
    (function() {
      'use strict';

      var currentState = 'idle';
      var currentPetType = 'cat';
      var config = null;
      var frames = {};
      var currentFrame = 0;
      var animationId = null;
      var lastFrameTime = 0;
      var isLoading = false;
      var loadFailed = false;
      var pendingState = null;
      var SPRITES_BASE_URL = '{SPRITES_BASE_URL}';
      var FPS = 8;

      var STATE_COLORS = {
        idle: '#888888',
        happy: '#FFD700',
        sad: '#4169E1',
        eating: '#FF6347',
        sleeping: '#9370DB',
        playing: '#32CD32'
      };

      function init() {
        window.addEventListener('message', function(event) {
          var message = event.data;
          switch (message.type) {
            case 'init':
              config = message.payload;
              initPet(config);
              break;
            case 'action':
              executeAction(message.payload);
              break;
            case 'stateUpdate':
              setState(message.payload);
              break;
            case 'switchPet':
              switchPet(message.payload);
              break;
            case 'move':
              updatePosition(message.payload.x, message.payload.y);
              break;
            case 'resize':
              updateSize(message.payload.width, message.payload.height);
              break;
          }
        });
      }

      function initPet(cfg) {
        config = cfg;
        currentPetType = cfg.petData ? cfg.petData.type : 'cat';

        var container = document.getElementById('pet-container');
        var loading = document.getElementById('loading');

        container.style.width = cfg.size.width + 'px';
        container.style.height = cfg.size.height + 'px';
        container.style.left = cfg.position.x + 'px';
        container.style.top = cfg.position.y + 'px';

        var canvas = document.getElementById('pet-canvas');
        canvas.width = cfg.size.width;
        canvas.height = cfg.size.height;

        loading.style.display = 'none';
        container.style.display = 'block';

        loadSprites(currentPetType);
      }

      function getSpriteUrl(petType, state, frameName) {
        return SPRITES_BASE_URL + '/' + petType + '/' + state + '/' + frameName;
      }

      function loadSprites(petType) {
        if (isLoading) return;
        isLoading = true;
        loadFailed = false;

        var states = ['idle', 'happy', 'sad', 'eating', 'sleeping', 'playing'];
        var frameCount = 4;
        var totalFrames = states.length * frameCount;
        var loadedCount = 0;

        frames = {};

        states.forEach(function(state) {
          frames[state] = [];
          for (var i = 1; i <= frameCount; i++) {
            var frameName = state + '_' + String(i).padStart(3, '0') + '.png';
            var img = new Image();

            img.onload = (function(state, img) {
              return function() {
                frames[state].push(img);
                loadedCount++;
                checkLoadComplete(loadedCount, totalFrames);
              };
            })(state, img);

            img.onerror = (function(state, img) {
              return function() {
                createPlaceholderFrame(img, state);
                frames[state].push(img);
                loadedCount++;
                checkLoadComplete(loadedCount, totalFrames);
              };
            })(state, img);

            img.src = getSpriteUrl(petType, state, frameName);
          }
        });
      }

      function createPlaceholderFrame(img, state) {
        var canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        var ctx = canvas.getContext('2d');
        var color = STATE_COLORS[state] || STATE_COLORS.idle;
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = '#ffffff';
        ctx.font = '24px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(state, 128, 138);
        img.src = canvas.toDataURL();
      }

      function checkLoadComplete(loaded, total) {
        if (loaded >= total) {
          isLoading = false;
          setState('idle');
          startAnimation();
          vscode.postMessage({ type: 'ready' });
        }
      }

      function setState(state) {
        currentState = state;
        currentFrame = 0;
        draw();
      }

      function draw() {
        var canvas = document.getElementById('pet-canvas');
        var ctx = canvas.getContext('2d');

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (frames[currentState] && frames[currentState][currentFrame]) {
          var img = frames[currentState][currentFrame];
          if (img && img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          } else {
            drawPlaceholder(ctx, currentState);
          }
        } else {
          drawPlaceholder(ctx, currentState);
        }
      }

      function drawPlaceholder(ctx, state) {
        var canvas = document.getElementById('pet-canvas');
        var color = STATE_COLORS[state] || STATE_COLORS.idle;
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.font = '20px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(state, canvas.width / 2, canvas.height / 2);
      }

      function startAnimation() {
        if (animationId) return;
        lastFrameTime = 0;
        animate();
      }

      function stopAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
      }

      function animate(timestamp) {
        var interval = 1000 / FPS;

        if (!lastFrameTime) lastFrameTime = timestamp;

        if (timestamp - lastFrameTime >= interval) {
          currentFrame = (currentFrame + 1) % 4;
          draw();
          lastFrameTime = timestamp;
        }

        animationId = requestAnimationFrame(animate);
      }

      function switchPet(petType) {
        currentPetType = petType;
        stopAnimation();
        isLoading = false;
        loadSprites(petType);
      }

          feed: 'eating',
          play: 'playing',
          groom: 'happy',
          rest: 'sleeping'
        };
        var newState = stateMap[action];
        if (newState) {
          setState(newState);
          setTimeout(function() {
            if (currentState === newState) {
              setState('idle');
            }
          }, 2000);
        }
      }

      function updatePosition(x, y) {
        var container = document.getElementById('pet-container');
        container.style.left = x + 'px';
        container.style.top = y + 'px';
      }

      function updateSize(width, height) {
        var container = document.getElementById('pet-container');
        var canvas = document.getElementById('pet-canvas');
        container.style.width = width + 'px';
        container.style.height = height + 'px';
        canvas.width = width;
        canvas.height = height;
        draw();
      }

      // Drag and resize
      (function() {
        var container = document.getElementById('pet-container');
        var isDragging = false;
        var startX, startY;

        container.addEventListener('mousedown', function(e) {
          if (e.target.classList.contains('resize-handle')) return;
          isDragging = true;
          startX = e.clientX - container.offsetLeft;
          startY = e.clientY - container.offsetTop;
        });

        document.addEventListener('mousemove', function(e) {
          if (!isDragging) return;
          container.style.left = (e.clientX - startX) + 'px';
          container.style.top = (e.clientY - startY) + 'px';
        });

        document.addEventListener('mouseup', function() {
          if (isDragging) {
            isDragging = false;
            vscode.postMessage({
              type: 'move',
              payload: {
                x: parseInt(container.style.left),
                y: parseInt(container.style.top)
              }
            });
          }
        });

        var handles = document.querySelectorAll('.resize-handle');
        handles.forEach(function(handle) {
          handle.addEventListener('mousedown', function(e) {
            e.stopPropagation();
            var corner = handle.getAttribute('data-corner');
            var startWidth = container.offsetWidth;
            var startHeight = container.offsetHeight;
            var startMouseX = e.clientX;
            var startMouseY = e.clientY;

            function onMouseMove(e) {
              var dx = e.clientX - startMouseX;
              var dy = e.clientY - startMouseY;

              if (corner.includes('e')) {
                container.style.width = Math.max(100, startWidth + dx) + 'px';
              }
              if (corner.includes('w')) {
                container.style.width = Math.max(100, startWidth - dx) + 'px';
              }
              if (corner.includes('s')) {
                container.style.height = Math.max(100, startHeight + dy) + 'px';
              }
              if (corner.includes('n')) {
                container.style.height = Math.max(100, startHeight - dy) + 'px';
              }
            }

            function onMouseUp() {
              document.removeEventListener('mousemove', onMouseMove);
              document.removeEventListener('mouseup', onMouseUp);
              vscode.postMessage({
                type: 'resize',
                payload: {
                  width: container.offsetWidth,
                  height: container.offsetHeight
                }
              });
              var canvas = document.getElementById('pet-canvas');
              canvas.width = container.offsetWidth;
              canvas.height = container.offsetHeight;
              draw();
            }

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
          });
        });

        container.addEventListener('click', function() {
          executeAction('play');
        });
      })();

      init();
    })();
  </script>
</body>
</html>
