<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Pet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    #pet-container {
      position: fixed;
      width: 80px;
      height: 80px;
      left: 50%;
      bottom: 60px;
      cursor: move;
      user-select: none;
      z-index: 99999;
    }
    #pet-sprite {
      width: 100%;
      height: 100%;
      cursor: pointer;
      image-rendering: pixelated;
      transition: transform 0.1s;
    }
    #pet-sprite:hover { transform: scale(1.1); }
    .resize-handle {
      position: absolute;
      width: 12px;
      height: 12px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(100, 100, 100, 0.5);
      border-radius: 2px;
    }
    .resize-handle.se { bottom: -6px; right: -6px; cursor: se-resize; }
    .resize-handle.sw { bottom: -6px; left: -6px; cursor: sw-resize; }
    .resize-handle.ne { top: -6px; right: -6px; cursor: ne-resize; }
    .resize-handle.nw { top: -6px; left: -6px; cursor: nw-resize; }
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #666;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div id="loading">Loading...</div>
  <div id="pet-container" style="display: none;">
    <img id="pet-sprite" src="" alt="Pet" />
    <div class="resize-handle se" data-corner="se"></div>
    <div class="resize-handle sw" data-corner="sw"></div>
    <div class="resize-handle ne" data-corner="ne"></div>
    <div class="resize-handle nw" data-corner="nw"></div>
  </div>

  <script>
    (function() {
      'use strict';

      var currentState = 'idle';
      var currentPetType = 'cat';
      var config = null;
      var frames = {};
      var currentFrame = 0;
      var animationId = null;
      var isLoading = false;
      var isWalking = false;
      var walkDirection = 1;
      var positionX = 50;
      var walkSpeed = 0.5;
      var walkInterval = null;
      var containerWidth = 80;
      var containerHeight = 80;
      var SPRITES_BASE_URL = '{SPRITES_BASE_URL}';
      var FPS = 8;

      var STATE_COLORS = {
        idle: '#888888',
        happy: '#FFD700',
        sad: '#4169E1',
        eating: '#FF6347',
        sleeping: '#9370DB',
        playing: '#32CD32'
      };

      function init() {
        window.addEventListener('message', function(event) {
          var message = event.data;
          switch (message.type) {
            case 'init': config = message.payload; initPet(config); break;
            case 'action': executeAction(message.payload); break;
            case 'stateUpdate': setState(message.payload); break;
            case 'switchPet': switchPet(message.payload); break;
          }
        });

        setupDragResize();
        startAutoWalk();
      }

      function initPet(cfg) {
        config = cfg;
        currentPetType = cfg.petData ? cfg.petData.type : 'cat';

        var loading = document.getElementById('loading');
        var container = document.getElementById('pet-container');

        loading.style.display = 'none';
        container.style.display = 'block';

        loadSprites(currentPetType);
      }

      function getSpriteUrl(petType, state, frameName) {
        return SPRITES_BASE_URL + '/' + petType + '/' + state + '/' + frameName;
      }

      function loadSprites(petType) {
        if (isLoading) return;
        isLoading = true;
        var states = ['idle', 'happy', 'sad', 'eating', 'sleeping', 'playing'];
        var frameCount = 4;
        var totalFrames = states.length * frameCount;
        var loadedCount = 0;
        frames = {};

        states.forEach(function(state) {
          frames[state] = [];
          for (var i = 1; i <= frameCount; i++) {
            var frameName = state + '_' + String(i).padStart(3, '0') + '.png';
            var img = new Image();
            img.onload = (function(s, img) {
              return function() { frames[s].push(img); loadedCount++; checkLoadComplete(loadedCount, totalFrames); };
            })(state, img);
            img.onerror = (function(s, img) {
              return function() { createPlaceholderFrame(img, s); frames[s].push(img); loadedCount++; checkLoadComplete(loadedCount, totalFrames); };
            })(state, img);
            img.src = getSpriteUrl(petType, state, frameName);
          }
        });
      }

      function createPlaceholderFrame(img, state) {
        var canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = STATE_COLORS[state] || STATE_COLORS.idle;
        ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = '#ffffff';
        ctx.font = '24px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(state, 128, 138);
        img.src = canvas.toDataURL();
      }

      function checkLoadComplete(loaded, total) {
        if (loaded >= total) {
          isLoading = false;
          setState('idle');
          startAnimation();
          vscode.postMessage({ type: 'ready' });
        }
      }

      function setState(state) {
        currentState = state;
        currentFrame = 0;

        if (state === 'playing' || state === 'eating') {
          stopWalk();
        } else if (state === 'sleeping') {
          stopWalk();
        } else {
          if (!isWalking) startWalk();
        }
      }

      function draw() {
        var sprite = document.getElementById('pet-sprite');
        if (frames[currentState] && frames[currentState][currentFrame]) {
          var img = frames[currentState][currentFrame];
          if (img && img.complete && img.naturalWidth > 0) {
            sprite.src = img.src;
          } else {
            sprite.src = getPlaceholderDataUrl(currentState);
          }
        } else {
          sprite.src = getPlaceholderDataUrl(currentState);
        }
      }

      function getPlaceholderDataUrl(state) {
        var canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = STATE_COLORS[state] || STATE_COLORS.idle;
        ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = '#ffffff';
        ctx.font = '24px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(state, 128, 138);
        return canvas.toDataURL();
      }

      function startAnimation() {
        if (animationId) return;
        var lastFrameTime = 0;
        function animate(timestamp) {
          var interval = 1000 / FPS;
          if (!lastFrameTime) lastFrameTime = timestamp;
          if (timestamp - lastFrameTime >= interval) {
            currentFrame = (currentFrame + 1) % 4;
            draw();
            lastFrameTime = timestamp;
          }
          animationId = requestAnimationFrame(animate);
        }
        animationId = requestAnimationFrame(animate);
      }

      function stopAnimation() {
        if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
      }

      function startWalk() {
        if (walkInterval) return;
        isWalking = true;
        walkInterval = setInterval(function() {
          positionX += walkSpeed * walkDirection;

          if (positionX >= 85) {
            positionX = 85;
            walkDirection = -1;
            flipSprite();
          } else if (positionX <= 15) {
            positionX = 15;
            walkDirection = 1;
            flipSprite();
          }

          updatePosition();
        }, 50);
      }

      function stopWalk() {
        if (walkInterval) {
          clearInterval(walkInterval);
          walkInterval = null;
        }
        isWalking = false;
      }

      function flipSprite() {
        var sprite = document.getElementById('pet-sprite');
        sprite.style.transform = walkDirection === 1 ? 'scaleX(1)' : 'scaleX(-1)';
      }

      function updatePosition() {
        var sprite = document.getElementById('pet-sprite');
        sprite.style.position = 'absolute';
        sprite.style.left = positionX + '%';
        sprite.style.bottom = '10px';
        sprite.style.transform = walkDirection === 1 ? 'scaleX(1)' : 'scaleX(-1)';
      }

      function switchPet(petType) {
        currentPetType = petType;
        stopAnimation();
        isLoading = false;
        loadSprites(petType);
      }

      function executeAction(action) {
        var stateMap = {
          feed: 'eating',
          play: 'playing',
          groom: 'happy',
          rest: 'sleeping'
        };
        var newState = stateMap[action];
        if (newState) {
          setState(newState);
          setTimeout(function() {
            if (currentState === newState) setState('idle');
          }, 2000);
        }
      }

      function setupDragResize() {
        var container = document.getElementById('pet-container');
        var isDragging = false;
        var startX, startY;

        container.addEventListener('mousedown', function(e) {
          if (e.target.classList.contains('resize-handle')) return;
          isDragging = true;
          startX = e.clientX - container.offsetLeft;
          startY = e.clientY - container.offsetTop;
        });

        document.addEventListener('mousemove', function(e) {
          if (!isDragging) return;
          var x = e.clientX - startX;
          var y = e.clientY - startY;
          container.style.left = x + 'px';
          container.style.top = y + 'px';
          container.style.right = 'auto';
          container.style.bottom = 'auto';
        });

        document.addEventListener('mouseup', function() {
          if (isDragging) {
            isDragging = false;
            vscode.postMessage({
              type: 'move',
              payload: { x: container.offsetLeft, y: container.offsetTop }
            });
          }
        });

        document.querySelectorAll('.resize-handle').forEach(function(handle) {
          handle.addEventListener('mousedown', function(e) {
            e.stopPropagation();
            var corner = handle.getAttribute('data-corner');
            var startWidth = container.offsetWidth;
            var startHeight = container.offsetHeight;
            var startMouseX = e.clientX;
            var startMouseY = e.clientY;

            function onMouseMove(e) {
              var dx = e.clientX - startMouseX;
              var dy = e.clientY - startMouseY;

              if (corner.includes('e')) {
                container.style.width = Math.max(50, startWidth + dx) + 'px';
              }
              if (corner.includes('w')) {
                container.style.width = Math.max(50, startWidth - dx) + 'px';
              }
              if (corner.includes('s')) {
                container.style.height = Math.max(50, startHeight + dy) + 'px';
              }
              if (corner.includes('n')) {
                container.style.height = Math.max(50, startHeight - dy) + 'px';
              }
            }

            function onMouseUp() {
              document.removeEventListener('mousemove', onMouseMove);
              document.removeEventListener('mouseup', onMouseUp);
              vscode.postMessage({
                type: 'resize',
                payload: { width: container.offsetWidth, height: container.offsetHeight }
              });
            }

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
          });
        });

        container.addEventListener('click', function(e) {
          if (!e.target.classList.contains('resize-handle')) {
            executeAction('play');
          }
        });
      }

      init();
    })();
  </script>
</body>
</html>
